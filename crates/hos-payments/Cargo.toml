[package]
name = "hos-payments"
description = "PaymentGateway implementations for HostingOS: Stripe, PayPal, iyzico, PayTR, NestPay/Payten 3D Pay Hosting, Paynet, Papara and bank transfer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `net`: outbound policy (DNS-checked client, no redirects) and capped body reads.
hos-core = { workspace = true, features = ["net"] }
async-trait = { workspace = true }
base64 = { workspace = true }
# SHA-512 for the NestPay / Payten "ver3" hash.
sha2 = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `tokio::sync::Mutex` serialises PayPal access-token refreshes.
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
