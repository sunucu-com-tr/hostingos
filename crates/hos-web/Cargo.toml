[package]
name = "hos-web"
description = "HostingOS axum application (binary hostingos): storefront, client area, admin, platform, REST API and webhooks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hostingos"
path = "src/main.rs"
# `main.rs` has no tests; without this `cargo test` links a second, unused
# test binary of all of hos-web.
test = false

[lints]
workspace = true

[dependencies]
hos-core = { workspace = true, features = ["sqlx"] }
hos-db = { workspace = true }
hos-auth = { workspace = true }
hos-mail = { workspace = true }
hos-seo = { workspace = true }
hos-domains = { workspace = true }
hos-virt = { workspace = true }
hos-panels = { workspace = true }
hos-payments = { workspace = true }
hos-billing = { workspace = true }
hos-jobs = { workspace = true }
hos-import = { workspace = true }
hos-update = { workspace = true }
rpassword = { workspace = true }
semver = { workspace = true }

anyhow = { workspace = true }
askama = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
hickory-resolver = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
ipnet = { workspace = true }
mail-parser = { workspace = true }
pulldown-cmark = { workspace = true }
qrcode = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
minisign = { workspace = true }
# Console relay tests (websocket client).
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
