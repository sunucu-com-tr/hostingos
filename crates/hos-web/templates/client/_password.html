{#- Service password reveal (htmx outerHTML swap of #svc-password). -#}
<span id="svc-password">
{%- match password %}{% when Some(p) %}
  <code class="mono" id="svc-pw-value">{{ p }}</code>
  <button type="button" class="btn btn--link btn--sm" data-copy="#svc-pw-value" data-copied="{{ t("common.actions.copied") }}">{{ icon("copy") }}{{ t("common.actions.copy") }}</button>
  <button type="button" class="btn btn--link btn--sm" hx-get="{{ url("/client/services/") }}{{ id }}/password?hide=1" hx-target="#svc-password" hx-swap="outerHTML">{{ t("client.services.hide") }}</button>
{%- when None %}
  {%- if !error.is_empty() %}<span class="small text-danger">{{ error }}</span>{% endif %}
  <span class="mono" aria-hidden="true">••••••••</span>
  <button type="button" class="btn btn--link btn--sm" hx-get="{{ url("/client/services/") }}{{ id }}/password" hx-target="#svc-password" hx-swap="outerHTML">{{ icon("eye") }}{{ t("client.services.show") }}</button>
{%- endmatch %}
</span>
