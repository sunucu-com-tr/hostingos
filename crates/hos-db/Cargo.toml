[package]
name = "hos-db"
description = "PostgreSQL migrations and tenant-scoped repository functions for HostingOS."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "hos-migrate"
path = "src/bin/hos-migrate.rs"
# No tests in the binary; don't link an empty test harness for it.
test = false

[dependencies]
hos-core = { workspace = true, features = ["sqlx"] }
sqlx = { workspace = true }
ipnet = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
