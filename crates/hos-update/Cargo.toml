[package]
name = "hos-update"
description = "HostingOS self-update: build/version info, signed release manifests (minisign), update discovery, install-type detection, the binary swap / rollback state machine and deploy webhooks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
hos-core = { workspace = true, features = ["net"] }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
minisign-verify = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
minisign = { workspace = true }
wiremock = { workspace = true }
