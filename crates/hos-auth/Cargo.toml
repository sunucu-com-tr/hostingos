[package]
name = "hos-auth"
description = "Authentication for HostingOS: argon2id passwords, sessions, CSRF, OAuth (Google, GitHub), TOTP 2FA, RBAC, one-time tokens, API keys and rate limiting."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pure logic + outbound HTTP (OAuth); persistence lives in hos-db, wiring in hos-web.
hos-core = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
# `legacy`: verification of imported (WHMCS) password hashes, never hashing.
bcrypt = { workspace = true }
hex = { workspace = true }
md-5 = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
totp-rs = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
wiremock = { workspace = true }
