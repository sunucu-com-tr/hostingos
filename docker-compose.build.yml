# Optional addition to docker-compose.yml: build the image from this
# checkout instead of running the published one, for changed code. The first
# build compiles HostingOS from source and takes a while.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml \
#     --env-file .env.production up -d --build
#
# Give both -f options to every command of such an installation (`run …
# setup`, `logs`, `down` …), or set them once for the shell:
#
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml
#
# otherwise Compose runs the published image again. The built image is
# called hostingos:local, so it is never mistaken for a published one or
# replaced by a pull, and `pull_policy: build` makes Compose build it rather
# than look for it in a registry (`docker compose pull` is not needed here).
#
# Commit and build date shown on the owner's server page (optional; the
# build context has no .git):
#
#   export HOS_BUILD_COMMIT="$(git rev-parse HEAD)" SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
#
# Arguments listed without a value are passed only when they are set.

x-local-build: &local-build
  context: .
  args:
    - HOS_BUILD_COMMIT
    - SOURCE_DATE_EPOCH

services:
  migrate:
    image: hostingos:local
    pull_policy: build
    build: *local-build

  app:
    image: hostingos:local
    pull_policy: build
    build: *local-build

  worker:
    image: hostingos:local
    pull_policy: build
    build: *local-build
