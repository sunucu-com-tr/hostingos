# Release: on a `v*` tag, build static Linux binaries (x86_64, aarch64),
# package, generate SBOMs and checksums, sign everything with minisign,
# publish a multi-arch image to GHCR with provenance, and create the GitHub
# Release with the signed update manifest. See docs/RELEASING.md.
#
# Required secrets (environment "release"): MINISIGN_SECRET_KEY,
# MINISIGN_PASSWORD (empty for a key generated with -W).
#
# Why musl: one static binary per architecture runs on every Linux
# distribution (no glibc version floor) and in any base image. The only C
# code in the dependency tree is ring and aws-lc-sys (rustls crypto); both
# build for musl with musl-gcc. There is no OpenSSL / native-tls (checked
# with `cargo tree -i openssl-sys` / `-i native-tls`). Trade-off: musl's
# allocator is slower under heavy multi-threaded allocation than glibc's.
#
# Reproducibility: pinned toolchain, --locked, SOURCE_DATE_EPOCH = commit
# time (also the build date shown in /platform), remapped source paths,
# tarballs with sorted entries, fixed mtime/owner and `gzip -n`.
#
# Third-party actions are pinned to full commit SHAs (comment = release).

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# Explicit `shell: bash` runs steps with `-eo pipefail`.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            # Native arm64 runner (no emulation, no cross C toolchain).
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and musl
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          # Kernel headers only (no glibc headers) for C code built with
          # musl-gcc (aws-lc includes <linux/…>).
          arch="${TARGET%%-*}"
          kh="$RUNNER_TEMP/kernel-headers"
          mkdir -p "$kh"
          ln -s /usr/include/linux "$kh/linux"
          ln -s /usr/include/asm-generic "$kh/asm-generic"
          ln -s "/usr/include/${arch}-linux-gnu/asm" "$kh/asm"
          t="${TARGET//-/_}"
          {
            echo "CC_${t}=musl-gcc"
            echo "CFLAGS_${t}=-idirafter $kh"
          } >> "$GITHUB_ENV"

      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $TAG is not v<semver>"; exit 1; }
          version="${TAG#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hos-web") | .version')"
          [ "$crate" = "$version" ] || { echo "::error::tag $TAG but the workspace version is $crate"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export HOS_BUILD_COMMIT="$GITHUB_SHA"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/build --remap-path-prefix=${HOME}/.cargo=/cargo"
          cargo build --release --locked --target "$TARGET" -p hos-web --bin hostingos
          bin="target/$TARGET/release/hostingos"
          info="$(file "$bin")"
          echo "$info"
          # Static, and reports what the updater's smoke test expects.
          [[ "$info" =~ static(-pie)?\ linked ]] || { echo "::error::not statically linked"; exit 1; }
          "$bin" version --json | jq -e --arg v "$VERSION" --arg t "$TARGET" '.version == $v and .target == $t'

      - name: Package
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          name="hostingos-${VERSION}-${TARGET}"
          stage="$RUNNER_TEMP/pkg/$name"
          mkdir -p "$stage/deploy" dist
          install -m 0755 "target/$TARGET/release/hostingos" "$stage/hostingos"
          cp -R static locales "$stage/"
          install -m 0644 README.md CHANGELOG.md SECURITY.md "$stage/"
          shopt -s nullglob
          for f in LICENSE* COPYING* NOTICE* THIRD-PARTY-NOTICES*; do install -m 0644 "$f" "$stage/"; done
          install -m 0644 docs/deploy/hostingos.service "$stage/deploy/"
          install -m 0755 docs/deploy/install.sh "$stage/deploy/"
          find "$stage" -type d -exec chmod 0755 {} +
          find "$stage/static" "$stage/locales" -type f -exec chmod 0644 {} +
          tar --format=gnu --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -C "$RUNNER_TEMP/pkg" -cf - "$name" | gzip -n -9 > "dist/${name}.tar.gz"
          tar -tzvf "dist/${name}.tar.gz" > "$RUNNER_TEMP/listing.txt"
          wc -l "$RUNNER_TEMP/listing.txt"

      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: SBOM (CycloneDX)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo cyclonedx --format json --target "$TARGET"
          sbom="$(find crates/hos-web -maxdepth 1 -name '*.cdx.json' | head -n 1)"
          [ -n "$sbom" ] || { echo "::error::no SBOM generated"; exit 1; }
          cp "$sbom" "dist/hostingos-${VERSION}-${TARGET}.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: sign, image, release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Protect with required reviewers and keep the signing secrets here
    # (Settings → Environments → release).
    environment: release
    permissions:
      contents: write # create the release
      packages: write # push the image to GHCR
      id-token: write # Sigstore OIDC for attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History and tags: migrations since the previous release.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Names
        id: names
        run: |
          version="${TAG#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/hostingos"
          {
            echo "VERSION=$version"
            echo "IMAGE=$image"
          } >> "$GITHUB_ENV"
          tags="${image}:${version}"
          if [[ "$version" != *-* ]]; then
            minor="${version%.*}"
            tags="${tags},${image}:${minor},${image}:latest"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Release notes and update manifest
        run: |
          python3 .github/scripts/release-manifest.py \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --image "$IMAGE" \
            --dist dist --notes-out "$RUNNER_TEMP/notes.md"

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.cdx.json hostingos-manifest.json > SHA256SUMS
          cat SHA256SUMS

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends minisign
          bash .github/scripts/sign-release.sh dist "hostingos $VERSION"
          ls -l dist

      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/hostingos-manifest.json

      - name: Image build context
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"; triple="${pair##*:}-unknown-linux-musl"
            mkdir -p "docker-dist/$arch"
            tar -xzf "dist/hostingos-${VERSION}-${triple}.tar.gz" -C "docker-dist/$arch" --strip-components=1
          done
          ls docker-dist/*

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=HostingOS
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub Release
        # Last: the manifest becomes visible to updaters only once the image
        # it names exists.
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.names.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "HostingOS $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag "${flags[@]}"
